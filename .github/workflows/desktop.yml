name: Mac app (.dmg)

# Builds the Mac app on a Mac and puts FC26-Challenges.dmg on the "desktop"
# release, so the site can link to
# https://github.com/IHAET/fc26_career_mode_challenge/releases/download/desktop/FC26-Challenges.dmg
on:
  push:
    paths:
      - 'desktop/**'
      - 'dist/**'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        working-directory: desktop
        run: npm ci
      - name: Bundle the offline copy
        run: |
          mkdir -p desktop/offline
          cp dist/fc26-challenge-builder.html desktop/offline/
      - name: Build the .dmg
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: FC26-Challenges-dmg
          path: desktop/out/FC26-Challenges.dmg
      - name: Publish to the "desktop" release
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view desktop >/dev/null 2>&1 || gh release create desktop --title "FC26 Challenges for Mac" --notes "The Mac app. Download FC26-Challenges.dmg, open it and drag FC26 Challenges to Applications. The first time, macOS says it was not opened because it is not signed by Apple yet: click Done, then System Settings, Privacy and Security, Open Anyway." --latest=false
          gh release edit desktop --notes "The Mac app. Download FC26-Challenges.dmg, open it and drag FC26 Challenges to Applications. The first time, macOS says it was not opened because it is not signed by Apple yet: click Done, then System Settings, Privacy and Security, Open Anyway."
          gh release upload desktop desktop/out/FC26-Challenges.dmg --clobber
